<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finder Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: libro mayor de postulaciones. Una barra de folio arriba, pestañas, y hojas de trabajo; el detalle se abre como un folio lateral. */
:root {
  --paper: #eef1f5;
  --sheet: #ffffff;
  --ink: #15203b;
  --ink-2: #4c5773;
  --ink-3: #5f6a82;
  --rule: #d9dee8;
  --accent: #2446b5;
  --accent-soft: #e3e9fb;
  --due: #955300;
  --due-soft: #fbeedb;
  --ok: #1b7549;
  --ok-soft: #dcf1e5;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --shadow: 0 1px 2px rgba(21,32,59,.06), 0 8px 24px rgba(21,32,59,.08);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d121d; --sheet: #151c2b; --ink: #e4e8f1; --ink-2: #a4aec5; --ink-3: #8590a9;
    --rule: #262f45; --accent: #92a9ff; --accent-soft: #1d2747; --due: #f0a746; --due-soft: #33240f;
    --ok: #5cc794; --ok-soft: #12291f; --bad: #ff8d84; --bad-soft: #3a1714;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d121d; --sheet: #151c2b; --ink: #e4e8f1; --ink-2: #a4aec5; --ink-3: #8590a9;
  --rule: #262f45; --accent: #92a9ff; --accent-soft: #1d2747; --due: #f0a746; --due-soft: #33240f;
  --ok: #5cc794; --ok-soft: #12291f; --bad: #ff8d84; --bad-soft: #3a1714;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
section.view > * { min-width: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: .82rem; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Folio superior */
.folio { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule); }
.folio-in { max-width: 1240px; margin: 0 auto; padding: 14px 16px 0; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.brand h1 { font-size: 1.45rem; }
.brand h1 span { color: var(--accent); }
.brand .meta { font-family: var(--f-mono); font-size: .78rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 10px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { font-family: var(--f-mono); font-size: .72rem; background: var(--due-soft); color: var(--due); border-radius: 99px; padding: 1px 6px; margin-left: 4px; }

.banner { margin-top: 16px; padding: 12px 14px; border-radius: var(--r); background: var(--due-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--due) 30%, transparent); }
.banner.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }

/* Hojas */
section.view { display: grid; gap: 22px; padding-top: 20px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--sheet); padding: 14px 16px; display: grid; gap: 2px; }
.kpi .v { font-family: var(--f-mono); font-size: 1.6rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
@media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.block { display: grid; gap: 10px; min-width: 0; }
.block-head { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.block-head .hint { font-size: .82rem; color: var(--ink-2); }
.cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }

.list { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 14px; padding: 12px 14px; border-top: 1px solid var(--rule); align-items: center; }
.row:first-child { border-top: 0; }
.row .t { font-weight: 600; min-width: 0; }
.row .s { color: var(--ink-2); font-size: .86rem; min-width: 0; overflow-wrap: anywhere; }
.row .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.row.clickable { cursor: pointer; }
.row.clickable:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
@media (max-width: 560px) { .row { grid-template-columns: minmax(0, 1fr); } .row .acts { justify-content: flex-start; } }
.empty { padding: 18px 16px; color: var(--ink-2); font-size: .9rem; }

.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r); padding: 6px 11px; font-size: .86rem; font-weight: 600; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.btn.warn { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }

.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 1px 8px; font-size: .74rem; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.due { background: var(--due-soft); color: var(--due); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.plain { background: transparent; border: 1px solid var(--rule); color: var(--ink-2); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.score { font-family: var(--f-mono); font-weight: 500; font-size: .8rem; min-width: 2.6em; text-align: center; border-radius: 4px; padding: 1px 5px; background: var(--accent-soft); color: var(--accent); }
.score.hi { background: var(--ok-soft); color: var(--ok); }
.score.lo { background: var(--paper); color: var(--ink-3); }

/* Pipeline */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters input[type=search], .filters select { border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r); padding: 6px 10px; min-width: 0; }
.filters input[type=search] { flex: 1 1 220px; }
.board { overflow-x: auto; padding-bottom: 8px; min-width: 0; max-width: 100%; }
.board-in { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; min-width: min-content; }
.lane { background: color-mix(in srgb, var(--sheet) 55%, var(--paper)); border: 1px solid var(--rule); border-radius: var(--r); display: grid; align-content: start; gap: 8px; padding: 10px; min-height: 120px; }
.lane h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); display: flex; justify-content: space-between; font-family: var(--f-body); font-weight: 600; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 9px 10px; display: grid; gap: 3px; text-align: left; width: 100%; }
.card:hover { border-color: var(--ink-3); }
.card .e { font-weight: 600; font-size: .9rem; overflow-wrap: anywhere; }
.card .c { color: var(--ink-2); font-size: .82rem; overflow-wrap: anywhere; }
.card .f { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; font-size: .74rem; color: var(--ink-3); }
.card.flag { box-shadow: inset 3px 0 0 var(--due); }
.card.flag.crit { box-shadow: inset 3px 0 0 var(--bad); }

/* Tablas */
.tbl-wrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--rule); vertical-align: top; }
th { border-top: 0; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 600; background: color-mix(in srgb, var(--paper) 50%, var(--sheet)); }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }

/* Barras de métricas */
.bars { display: grid; gap: 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; }
.bar-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 92px; gap: 10px; align-items: center; font-size: .86rem; }
.bar-track { position: relative; height: 18px; background: var(--paper); border-radius: 3px; overflow: hidden; }
.bar-fill { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--accent) 28%, transparent); }
.bar-fill.adv { background: var(--accent); }
.bar-row .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; font-size: .8rem; }
.legend { display: flex; gap: 14px; font-size: .78rem; color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
@media (max-width: 560px) { .bar-row { grid-template-columns: 90px minmax(0, 1fr) 76px; } }

/* Formularios */
.form { display: grid; gap: 12px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px; }
.caso { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
.caso label.f { flex: 1 1 160px; }
.caso label.f.palabras { flex: 1 1 100%; }
.caso label.f.palabras textarea { min-height: 52px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
label.f { display: grid; gap: 4px; font-size: .78rem; color: var(--ink-2); font-weight: 600; }
label.f input, label.f select, label.f textarea { border: 1px solid var(--rule); background: var(--paper); border-radius: var(--r); padding: 7px 9px; font-size: .92rem; color: var(--ink); font-weight: 400; min-width: 0; width: 100%; }
label.f textarea { min-height: 200px; resize: vertical; line-height: 1.5; font-family: var(--f-body); }
label.chk { display: flex; gap: 8px; align-items: center; font-size: .9rem; }

/* Folio lateral */
.scrim { position: fixed; inset: 0; background: rgba(8,12,22,.4); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); z-index: 41; background: var(--sheet); box-shadow: var(--shadow); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; align-content: start; }
.drawer .dh { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.drawer .dh h2 { font-size: 1.3rem; }
.dsec { display: grid; gap: 8px; border-top: 1px solid var(--rule); padding-top: 14px; }
.dsec > h3 { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); font-family: var(--f-body); font-weight: 600; }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 12px; font-size: .9rem; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.breakdown { display: grid; gap: 5px; }
.bd { display: grid; grid-template-columns: 96px minmax(0, 1fr) 54px; gap: 8px; align-items: center; font-size: .82rem; }
.bd .bar-track { height: 10px; }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-top: 1px dashed var(--rule); font-size: .86rem; }
.tl:first-child { border-top: 0; }
.tl .d { font-family: var(--f-mono); font-size: .76rem; color: var(--ink-2); padding-top: 2px; }
.tl .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 600; }
.confirm { border: 1px solid var(--due); background: var(--due-soft); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; }
.confirm.bad { border-color: var(--bad); background: var(--bad-soft); }
.bigscore { font-family: var(--f-mono); font-size: 2.2rem; font-weight: 500; line-height: 1; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--sheet); padding: 10px 16px; border-radius: var(--r); font-size: .9rem; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast.bad { background: var(--bad); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
</style>

<header class="folio">
  <div class="folio-in">
    <div class="brand">
      <h1>Finder <span>Work</span></h1>
      <div class="meta" id="folio-meta">CRM de postulaciones</div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-view="hoy" aria-selected="true" id="tab-hoy">Hoy</button>
      <button role="tab" data-view="pipeline" aria-selected="false" id="tab-pipeline">Pipeline</button>
      <button role="tab" data-view="empresas" aria-selected="false" id="tab-empresas">Empresas</button>
      <button role="tab" data-view="metricas" aria-selected="false" id="tab-metricas">Métricas</button>
      <button role="tab" data-view="ajustes" aria-selected="false" id="tab-ajustes">Ajustes</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>
  <section class="view" id="v-hoy">
    <div class="list"><div class="empty">Cargando tu libro de postulaciones… Aquí aparecen las vacantes para aprobar, los correos listos para enviar y las acciones del día.</div></div>
  </section>
  <section class="view" id="v-pipeline" hidden></section>
  <section class="view" id="v-empresas" hidden></section>
  <section class="view" id="v-metricas" hidden></section>
  <section class="view" id="v-ajustes" hidden></section>
</main>
<div id="overlay"></div>
<div id="toast-slot"></div>

<script src="puntaje.js"></script>
<script>
(function () {
  "use strict";
  const Motor = window.Motor;

  // ---------- Constantes ----------
  const ETAPAS = [
    ["descubierta", "Descubierta"], ["por_aprobar", "Por aprobar"], ["aprobada", "Aprobada"],
    ["postulada", "Postulada"], ["hv_vista", "HV vista"], ["en_proceso", "En proceso"],
    ["oferta", "Oferta"], ["cerrada", "Cerrada"]
  ];
  const ETAPA_NOMBRE = Object.fromEntries(ETAPAS);
  const ORDEN = ETAPAS.map(e => e[0]);
  const RESULTADOS = {
    contratado: "Contratado", no_seleccionado: "No seleccionado", finalizado: "Proceso finalizado",
    sin_respuesta: "Sin respuesta", vacante_cerrada: "Vacante cerrada", descartada: "Descartada", archivada: "Archivada"
  };
  const ALERTAS = {
    posible_estafa: ["Posible estafa", "bad"], conflicto_estado: ["Estado en conflicto", "bad"],
    vacante_cerrada: ["Vacante ya cerrada", "due"], verificar_dominio: ["Verificar dominio", "due"],
    verificar_empresa: ["Verificar empresa", "due"], verificar_modalidad: ["Verificar modalidad", "due"],
    preguntas_pendientes: ["Preguntas pendientes", "due"], entrevista_declinada: ["Entrevista declinada", "due"],
    no_aplica: ["No aplica", "bad"]
  };
  const TIPOS_HIST = {
    postulacion: "Postulación", correo_enviado: "Correo enviado", respuesta: "Respuesta", entrevista: "Entrevista",
    cambio_etapa: "Etapa", nota: "Nota", llamada: "Llamada", accion: "Acción"
  };
  const NIVELES = ["auxiliar", "profesional", "senior", "gerencia", "docencia"];
  const PERFILES = Object.keys(Motor.PUNTOS_PERFIL);
  const MODALIDADES = [["remoto", "Remoto"], ["hibrido", "Híbrido"], ["presencial", "Presencial"], ["no_especificado", "No especificada"]];
  const CONTRATOS = [["tiempo_completo", "Tiempo completo"], ["parcial", "Medio tiempo o por servicio"]];
  const SIN_NOVEDAD = "Sin contacto directo";

  // ---------- Estado ----------
  const S = {
    db: null, downloads: null,
    vac: new Map(), emp: new Map(), bor: new Map(), ajustes: null, corrida: null,
    cargado: { vac: false, emp: false, bor: false },
    view: "hoy", filtros: { q: "", perfil: "", portal: "", cerradas: false },
    panel: null, // {tipo:'vacante'|'borrador', id}
    confirm: null, ocupado: false
  };

  // ---------- Utilidades ----------
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (k === "html") continue;
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat(Infinity)) {
      if (k == null || k === false) continue;
      n.append(k.nodeType ? k : document.createTextNode(String(k)));
    }
    return n;
  }
  function hoy() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function masDias(iso, n) { const d = new Date((iso || hoy()) + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  function fFecha(iso) { if (!iso) return "—"; const [y, m, d] = iso.split("-"); return +d + " " + MESES[+m - 1] + (y !== hoy().slice(0, 4) ? " " + y : ""); }
  function cop(n) { if (n == null || isNaN(n)) return "—"; return (n < 0 ? "−$" : "$") + Math.abs(Math.round(n)).toLocaleString("es-CO"); }
  function dias(desde) { return Motor.diasEntre(desde, hoy()); }
  function ajustes() { return Object.assign({}, Motor.AJUSTES_BASE, S.ajustes || {}); }
  function calc(v) { return Motor.puntaje(v, ajustes(), hoy()); }
  function scoreClass(t) { return t >= ajustes().umbralAprobar ? "score hi" : t < 40 ? "score lo" : "score"; }
  function abierta(v) { return v.etapa !== "cerrada"; }
  function alertaChips(v) { return (v.alertas || []).map(a => el("span", { class: "chip " + ((ALERTAS[a] || [a, "due"])[1]), "data-a": a }, (ALERTAS[a] || [a])[0])); }
  function enlaceSeguro(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
  function nivelAlerta(v) { const a = v.alertas || []; if (!a.length) return ""; return a.some(x => (ALERTAS[x] || [])[1] === "bad") ? "flag crit" : "flag"; }
  function sinNovedad(v) { return v.proximaAccion && (v.proximaAccion.texto || "").startsWith(SIN_NOVEDAD); }
  function noRecomendado(b) { return (b.nota || "").toLowerCase().includes("no enviar"); }

  let toastT = null;
  function toast(msg, bad) {
    const slot = document.getElementById("toast-slot");
    slot.replaceChildren(el("div", { class: "toast" + (bad ? " bad" : ""), role: "status" }, msg));
    clearTimeout(toastT); toastT = setTimeout(() => slot.replaceChildren(), bad ? 7000 : 3500);
  }

  // ---------- Escrituras ----------
  // Con "_rev" en datos, abrir_pagina.py no escribe si el registro cambió desde esa versión (code "conflict").
  // reintentar = quien llama vuelve a leer y reintenta solo: no se muestra el aviso.
  async function escribir(ruta, datos, crear, reintentar) {
    if (!S.db) { toast("La base de datos no está disponible en esta vista.", true); throw new Error("sin db"); }
    try {
      const ref = S.db.doc(ruta);
      if (crear) await ref.set(datos); else await ref.update(datos);
    } catch (e) {

  // ---------- Base local (Programa CRM/abrir_pagina.py sobre Programa CRM/postulaciones.db) ----------
  // Misma forma que usaba la página: collection().limit().orderBy().onSnapshot y doc().get/set/update/onSnapshot.
  // ponytail: se refresca cada 5 s y después de cada escritura; otra pestaña abierta tarda hasta 5 s en ver un cambio.
  async function dbLocal() {
    try { if (!(await fetch("/api/config")).ok) return null; } catch (_) { return null; }
    const subs = [];
    const traer = async (col) => { const r = await fetch("/api/" + col); if (!r.ok) throw { code: "unavailable" }; return r.json(); };
    let pendiente = null;
    function refrescar() {
      // Varias suscripciones o escrituras seguidas se juntan en una sola ronda de lecturas.
      return pendiente || (pendiente = Promise.resolve().then(async () => {
        pendiente = null;
        const datos = {};
        await Promise.all([...new Set(subs.map(s => s.col))].map(async c => { try { datos[c] = await traer(c); } catch (e) { datos[c] = e; } }));
        for (const s of subs) {
          const d = datos[s.col];
          if (!Array.isArray(d)) { if (s.err) s.err(d); continue; }
          const snap = s.armar(d), txt = JSON.stringify(snap);
          if (txt !== s.ultimo) { s.ultimo = txt; s.next(s.envolver(snap)); }  // sin cambios no se repinta
        }
      }));
    }
    const docSnap = (fila) => ({ id: fila && fila.id, exists: !!fila, data: () => fila ? fila.data : undefined });
    function consulta(col, o) {
      return {
        limit: (n) => consulta(col, Object.assign({}, o, { limit: n })),
        orderBy: (campo, dir) => consulta(col, Object.assign({}, o, { campo, dir })),
        onSnapshot(next, err) {
          subs.push({ col, next, err, envolver: (filas) => ({ docs: filas.map(docSnap) }), armar: (filas) => {
            let f = filas.slice();
            if (o.campo) f.sort((a, b) => String(a.data[o.campo] ?? "").localeCompare(String(b.data[o.campo] ?? "")) * (o.dir === "desc" ? -1 : 1));
            return o.limit ? f.slice(0, o.limit) : f;
          } });
          refrescar();
        }
      };
    }
    async function escribirDoc(ruta, op, data) {
      const r = await fetch("/api/" + ruta, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ op, data }) });
      if (!r.ok) throw { code: r.status === 404 ? "not_found" : r.status === 409 ? "conflict" : "unavailable" };
      refrescar();
    }
    setInterval(refrescar, 5000);
    return {
      collection: (col) => consulta(col, {}),
      doc(ruta) {
        const [col, id] = ruta.split("/");
        return {
          get: async () => docSnap((await traer(col)).find(f => f.id === id)),
          set: (data) => escribirDoc(ruta, "set", data),
          update: (data) => escribirDoc(ruta, "update", data),
          onSnapshot(next, err) { subs.push({ col, next, err, envolver: docSnap, armar: (filas) => filas.find(f => f.id === id) }); refrescar(); }
        };
      }
    };
  }

  function panelBorrador(id, b) {

    const valido = (xs) => xs.length && xs.every(x => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
    const guardar = () => escribir("borradores/" + id, { para: lista(ed.para), cc: lista(ed.cc), asunto: ed.asunto, cuerpo: ed.cuerpo, adjuntarHV: ed.adjuntarHV });

  // ---------- Correos ----------
  // El usuario envía desde su Gmail; aquí solo se marca que salió y se mueve la vacante.
  async function marcarEnviado(id, ed, lista) {
    const b = S.bor.get(id);
    S.ocupado = true; renderPanel();
    try {
      await escribir("borradores/" + id, { estado: "enviado", enviadoEn: new Date().toISOString() });
      const v = S.vac.get(b.vacanteId);
      if (v) {
        const a = ajustes(); const seg = (v.seguimientos || 0) + (b.tipo === "seguimiento" ? 1 : 0);
        const cambios = { seguimientos: seg };
        if (b.tipo === "postulacion") { cambios.etapa = "postulada"; cambios.fechaPostulacion = hoy(); }
        cambios.proximaAccion = seg >= a.maxSeguimientos
          ? { fecha: masDias(hoy(), a.diasEntreSeguimientos), texto: "Tope de seguimientos: si no responden, cerrar como sin respuesta" }
          : { fecha: masDias(hoy(), seg ? a.diasEntreSeguimientos : a.diasPrimerSeguimiento), texto: "Enviar seguimiento" };
        await actualizarVacante(b.vacanteId, cambios, { tipo: b.tipo === "postulacion" ? "postulacion" : "correo_enviado", texto: (b.tipo === "postulacion" ? "Postulación" : "Seguimiento") + " enviado por el usuario a " + lista(ed.para).join(", ") + ": “" + ed.asunto + "”" });
      }
      S.confirm = null; toast("Marcado como enviado.");
